name: Publish to Mooncakes

# Publishing needs egress to mooncakes.io. The development machine used for the
# rest of this repository can only reach github.com, so the release runs here
# instead: a runner with normal internet installs the toolchain, writes the
# Mooncakes credential from a repository secret and publishes moon.mod's version.
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: mooncakes-publish
  cancel-in-progress: false

env:
  REGISTRY_MODULE: sun-zhao12/moon-mrp

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Write Mooncakes credentials
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "::error::MOONCAKES_TOKEN secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          jq -n --arg t "$MOONCAKES_TOKEN" \
            '{token: $t, username: "sun-zhao12"}' > "$HOME/.moon/credentials.json"
          chmod 600 "$HOME/.moon/credentials.json"
          moon whoami
      - name: Registry state before publishing
        run: |
          set -euo pipefail
          url="https://mooncakes.io/api/v0/modules/${REGISTRY_MODULE}"
          code=$(curl -s -o registry-before.json -w '%{http_code}' "$url")
          echo "GET $url -> $code"
          jq -c '.' registry-before.json 2>/dev/null || cat registry-before.json
      - name: Verify the sources
        run: |
          moon version --all
          moon check --deny-warn --target all
          moon test --deny-warn --target all
      - name: Publish
        run: |
          set +e
          echo "--- dry run (this moon version exits non-zero after a 202 Accepted) ---"
          moon publish --dry-run
          echo "dry run exit code: $?"
          echo "--- publish ---"
          moon publish
          status=$?
          echo "publish exit code: $status"
          exit $status
      - name: Registry state after publishing
        if: always()
        run: |
          set -euo pipefail
          url="https://mooncakes.io/api/v0/modules/${REGISTRY_MODULE}"
          code=$(curl -s -o registry-after.json -w '%{http_code}' "$url")
          echo "GET $url -> $code"
          jq -r '"module: " + ((.name // "?") | tostring) +
                 "  version: " + ((.version // "?") | tostring) +
                 "  build_status: " + ((.build_status // "?") | tostring)' registry-after.json 2>/dev/null \
            || cat registry-after.json
