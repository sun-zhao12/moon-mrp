name: MoonBit core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      # Formatting is intentionally not a gate. The canonical form of a source
      # file depends on the formatter release: newer toolchains rewrite `Int`
      # to `Int32` and optional labels `name?` to `name~`, while the 0.10.14
      # toolchain used to verify this module locally rejects `Int32` entirely.
      # The sources here are the portable spelling that compiles on both.
      - name: Check, build and test
        run: |
          moon version --all
          moon check --deny-warn --target all
          moon build --target all
          moon test --deny-warn --target all
      - name: Exercise public API
        run: |
          for target in wasm wasm-gc js native; do
            moon run examples/demo --target "$target"
          done
